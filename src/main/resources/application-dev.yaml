# Local development. Relaxed, docs on, dev services via Compose.
spring:
  docker:
    compose:
      enabled: true # requires docker; set false (or SPRING_DOCKER_COMPOSE_ENABLED=false) if absent
  ai:
    vectorstore:
      type: ${VECTOR_STORE_TYPE:pgvector}

app:
  providers:
    pg:
      enabled: ${APP_PG_ENABLED:true}
  cors:
    enabled: true
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
      - "http://127.0.0.1:3000"
      - "http://127.0.0.1:5173"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "*"
    exposed-headers:
      - "Location"
    allow-credentials: true
    max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  show-actuator: true

logging:
  level:
    com.ai.docmind: DEBUG
    org.springframework.ai: INFO
