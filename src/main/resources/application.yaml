::spring:
  application:
    name: docmind
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # No spring.datasource.url on purpose: providers below define their own
  # qualified DataSources only when enabled. Exclude Boot's default pool.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.orm.jpa.HibernateJpaAutoConfiguration
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  # Dev services are opt-in per profile: spring-boot-docker-compose only
  # runs when the active profile enables it (dev) AND docker exists.
  docker:
    compose:
      enabled: false
  # Spring AI — OpenAI for chat + embedding; pgvector for vector store
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
        temperature: ${OPENAI_CHAT_TEMPERATURE:1.0}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    vectorstore:
      type: ${VECTOR_STORE_TYPE:none}
      pgvector:
        initialize-schema: true
        dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
        index-type: hnsw
        distance-type: cosine-distance
        table-name: vector_store


app:
  name: docmind
  version: 0.0.1-SNAPSHOT
  description: AI document-mind backend (Spring AI + pgvector)
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:500}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:100}
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.7}
  storage:
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:data/uploads}
  providers:
    mysql:
      enabled: false
      url: jdbc:mysql://localhost:3306/docmind?useSSL=false&allowPublicKeyRetrieval=true
      username: docmind
      password: docmind
      driver-class-name: com.mysql.cj.jdbc.Driver
      maximum-pool-size: 10
      minimum-idle: 2
    pg:
      enabled: false
      url: jdbc:postgresql://localhost:5432/docmind
      username: docmind
      password: docmind
      driver-class-name: org.postgresql.Driver
      maximum-pool-size: 15
      minimum-idle: 2
    mongo:
      enabled: false
      connection-string: mongodb://localhost:27017/docmind
      database: docmind
    cassandra:
      enabled: false
      contact-points:
        - 127.0.0.1
      port: 9042
      datacenter: datacenter1

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ai.docmind: INFO
